[build-system]
requires = ["setuptools>=46.1.0", "setuptools_scm[toml]>=5"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
version_scheme = "no-guess-dev"

[project]
name = "mnist_trainer"
dependencies = [
    "click",
    "tensorflow"
]

[project.scripts]
mnist-train = "mnist_trainer.train:train_mnist_model"
